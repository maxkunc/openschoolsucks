<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenSchoolSucks - Známka</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='styles/global.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='styles/znamka.css') }}">
</head>

<body id="znamka">
    {% include 'includes/navbar.html' %}
    <main class="subject-page">
        <a href="{{ url_for('home') }}" class="back-link">
            <span class="icon-mask icon-arrow-left"></span>
            Zpět na přehled
        </a>

        <section class="panel">
            {% if znamky|length == 0 %}
            <p class="empty-state">Nenalezeny žádné známky</p>
            {% else %}
            <div class="grades-list">
                <div class="grade-row grade-row-head">
                    <span></span>
                    <span class="col-extra">Datum</span>
                    <span>Název</span>
                    <span class="col-highlight">Procenta</span>
                    <span class="col-extra">Body</span>
                    <span class="col-extra">Popis</span>
                </div>
                {% for row in znamky %}
                <div class="grade-row">
                    <span class="grade-badge" data-grade="{{ row[7] if row[7] in [1,2,3,4,5] else 'none' }}">{{ row[7] }}</span>
                    <span class="cell-dim col-extra">{{ row[0] }}</span>
                    <span class="cell-primary">{{ row[1] }}</span>
                    <span class="col-highlight">{{ row[5] }}</span>
                    <span class="col-extra">{{ row[4] }}</span>
                    <span class="cell-dim col-extra">{{ row[6] }}</span>
                </div>
                {% endfor %}
            </div>
            {% endif %}
        </section>
    </main>
</body>

</html>
