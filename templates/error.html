<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenSchoolSucks - Error</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='styles/global.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='styles/error.css') }}">
</head>

<body id="error">
    <main class="error-page">
        <div class="panel error-card">
            <div class="error-badge">Chyba</div>
            <h1>Máťa něco pokazil...</h1>
            {% if error or message %}
            <p class="error-detail">{{ error or message }}</p>
            {% endif %}
            <a href="{{ url_for('login') }}" class="back-link">
                <span class="icon-mask icon-arrow-left"></span>
                Zpět na přihlášení
            </a>
        </div>
    </main>
</body>

</html>
